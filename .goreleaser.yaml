# Static linux binaries. The SQLite driver is cgo, so cross-compilation uses
# zig as the C compiler and links statically against musl. The external
# linker keeps the C debug info unless told to strip (-extldflags -s).
#
# Rehearse locally with: goreleaser release --snapshot --clean
version: 2

builds:
  - id: linux-amd64
    main: ./cmd/raftman
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-musl
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}} -linkmode external -extldflags '-static -s'"]
  - id: linux-arm64
    main: ./cmd/raftman
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-musl
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}} -linkmode external -extldflags '-static -s'"]
  - id: linux-armv7
    main: ./cmd/raftman
    goos: [linux]
    goarch: [arm]
    goarm: ["7"]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target arm-linux-musleabihf
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}} -linkmode external -extldflags '-static -s'"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md, passed with --release-notes by
# release.yml, which makes goreleaser skip its own git-based changelog.
# Do not set changelog.disable: it also skips loading that file.
changelog:
  use: git
